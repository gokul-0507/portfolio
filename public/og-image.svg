<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Background -->
  <rect width="1200" height="630" fill="#0B0F14" />

  <!-- Fine Technical Grid Motif -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1" stroke-opacity="0.4" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer 1px Subtle Border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" stroke="#1F2937" stroke-width="2" />

  <!-- Top Monospace Status Bar -->
  <g transform="translate(64, 72)">
    <circle cx="8" cy="8" r="6" fill="#5EEAD4" />
    <text x="24" y="13" fill="#5EEAD4" font-family="monospace" font-size="14" font-weight="600" letter-spacing="2">SYSTEMS THAT SENSE AND REASON</text>
    <text x="960" y="13" fill="#9AA6B5" font-family="monospace" font-size="14">SRM EEC // 2025–2029</text>
  </g>

  <!-- Divider -->
  <line x1="64" y1="110" x2="1136" y2="110" stroke="#1F2937" stroke-width="1.5" />

  <!-- Main Hero Editorial Typography -->
  <text x="64" y="240" fill="#E8ECF1" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">Gokul J.</text>
  <text x="64" y="310" fill="#5EEAD4" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600">Computer Science and Design Undergraduate</text>
  
  <text x="64" y="380" fill="#9AA6B5" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">SRM Easwari Engineering College · Chennai, India</text>
  <text x="64" y="415" fill="#9AA6B5" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">Software Development · AI/ML · Computer Vision · Agentic AI</text>

  <!-- Project Badges Box -->
  <g transform="translate(64, 480)">
    <!-- SatQuery Badge -->
    <rect x="0" y="0" width="300" height="60" rx="10" fill="#121821" stroke="#1F2937" stroke-width="1.5" />
    <circle cx="24" cy="30" r="4" fill="#5EEAD4" />
    <text x="40" y="26" fill="#9AA6B5" font-family="monospace" font-size="11">01 · AGENTIC AI</text>
    <text x="40" y="46" fill="#E8ECF1" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">SatQuery AI</text>

    <!-- EchoGrid Badge -->
    <rect x="320" y="0" width="320" height="60" rx="10" fill="#121821" stroke="#1F2937" stroke-width="1.5" />
    <circle cx="344" cy="30" r="4" fill="#F5A524" />
    <text x="360" y="26" fill="#9AA6B5" font-family="monospace" font-size="11">02 · PROPOSAL</text>
    <text x="360" y="46" fill="#E8ECF1" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">EchoGrid Structural Health</text>
  </g>

  <!-- Right Signal Graphic -->
  <g transform="translate(900, 220)">
    <circle cx="120" cy="120" r="110" stroke="#1F2937" stroke-width="1.5" />
    <circle cx="120" cy="120" r="75" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="120" cy="120" r="40" stroke="#5EEAD4" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="120" cy="120" r="6" fill="#5EEAD4" />
    <line x1="120" y1="120" x2="200" y2="40" stroke="#5EEAD4" stroke-width="2" />
  </g>
</svg>
